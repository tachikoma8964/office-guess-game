<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>縣長票數猜猜樂</title>
<meta property="og:type" content="website">
<meta property="og:title" content="縣長票數猜猜樂">
<meta property="og:description" content="辦公室同樂，只算積分。">
<meta property="og:url" content="https://tachikoma8964.github.io/office-guess-game/">
<meta property="og:image" content="https://tachikoma8964.github.io/office-guess-game/assets/og.jpg?v=1">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="縣長票數猜猜樂">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <img src="assets/toucheng-coast.jpg" width="1024" height="684" alt="頭城海岸與遠方的龜山島">
  <h1>縣長票數猜猜樂</h1>
</header>

<main>
  <p class="intro">猜林國漳贏吳宗憲幾票、幾％。兩項各 500 分，最接近的人拿走，一樣近就平分。</p>

  <form class="box" id="guess-form" novalidate>
    <label for="name">名字</label>
    <input id="name" maxlength="20" autocomplete="off">
    <fieldset>
      <legend>林國漳會</legend>
      <div class="choice">
        <label><input type="radio" name="side" value="1" checked><span>贏</span></label>
        <label><input type="radio" name="side" value="-1"><span>輸</span></label>
      </div>
    </fieldset>
    <div class="pair">
      <div><label for="votes">差幾票</label><input id="votes" inputmode="numeric" autocomplete="off"></div>
      <div><label for="pct">差幾％</label><input id="pct" inputmode="decimal" autocomplete="off"></div>
    </div>
    <button class="button" id="submit">送出</button>
    <p class="msg" id="msg" role="status"></p>
  </form>

  <section aria-labelledby="list-title">
    <h2 id="list-title">大家猜的</h2>
    <p id="empty">還沒有人猜。</p>
    <div class="box scroll" id="list-box"><table id="list"></table></div>
    <button type="button" class="link" id="clear">全部清除</button>
  </section>

  <details>
    <summary>開票了，算分數</summary>
    <form class="box" id="result-form" novalidate>
      <div class="pair">
        <div><label for="r-lv">林國漳票數</label><input id="r-lv" inputmode="numeric" autocomplete="off"></div>
        <div><label for="r-lp">林國漳得票率％</label><input id="r-lp" inputmode="decimal" autocomplete="off"></div>
        <div><label for="r-wv">吳宗憲票數</label><input id="r-wv" inputmode="numeric" autocomplete="off"></div>
        <div><label for="r-wp">吳宗憲得票率％</label><input id="r-wp" inputmode="decimal" autocomplete="off"></div>
      </div>
      <button class="button">算分數</button>
      <p class="msg" id="r-msg" role="status"></p>
    </form>
  </details>
</main>

<footer>
  <p>辦公室同樂，只算積分，不碰錢和獎品。資料只存在這台裝置的瀏覽器。</p>
  <p>照片：<a href="https://www.flickr.com/photos/124612017@N06/46391078902">頭城濱海</a>，chunchun14，<a href="https://creativecommons.org/licenses/by/2.0/">CC BY 2.0</a>（經裁切與調暗）。</p>
</footer>

<script src="scoring.js"></script>
<script src="app.js"></script>
</body>
</html>
